function t(k){return T[lang][k]||T.en[k]||k}
function esc(v){return String(v||"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("languageLabel").textContent=lang==="ar"?"العربية":"English";$("joinTitle").textContent=t("joinTitle");$("joinDescription").textContent=t("joinDescription");$("playerName").placeholder=t("yourName");$("joinBtn").textContent=t("join");$("voiceHint").textContent=t("voiceHint");$("footerNote").textContent=lang==="ar"?"حافظ على سرية دورك ولا تعرض الشاشة لأي لاعب.":"Keep your role secret. Do not show your screen to anyone."}
function api(path,body){return fetch("/api/mafia/"+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","Accept":"application/json"},...(body?{body:JSON.stringify(body)}:{})}).then(async r=>{let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Request failed");return d})}
function showGame(){ $("joinPanel").classList.add("hidden");$("gamePanel").classList.remove("hidden") }
function unlockVoice(){
 try{if(window.speechSynthesis)speechSynthesis.getVoices()}catch{}
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!audioContext)audioContext=new AudioContextClass();
  const resumed=audioContext.state==="suspended"?audioContext.resume():Promise.resolve();
  const silent=audioContext.createBuffer(1,1,audioContext.sampleRate);
  const source=audioContext.createBufferSource();source.buffer=silent;source.connect(audioContext.destination);source.start(0);
  Promise.resolve(resumed).catch(()=>{});
 }catch{}
}
$("joinBtn").onclick=join;
async function join(){unlockVoice();$("joinError").textContent="";const name=$("playerName").value.trim();if(!name){$("joinError").textContent=lang==="ar"?"اكتب اسمك أولاً.":"Enter your name first.";return}try{const d=await api("join",{roomId,key,name});playerId=d.playerId;localStorage.setItem("jalsa_mafia_"+roomId,playerId);showGame();startPolling()}catch(e){$("joinError").textContent=e.message}}
function startPolling(){if(!pollTimer)pollTimer=setInterval(poll,900);poll()}
if(!roomId||!key){$("joinError").textContent=lang==="ar"?"رمز الدعوة غير صالح. امسح QR من شاشة المضيف.":"Invalid invite. Scan the QR code on the host screen.";$("joinBtn").disabled=true}
else if(playerId){showGame();startPolling()}

 else if(stage==="discussion"){title=t("discussion");detail=t("votePrompt");if(s.hasVoted){text="✓";detail=t("voteWaiting")+" ("+(s.voteCount||0)+"/"+(s.aliveCount||0)+")"}else if(s.player.alive){area=buttonList(s.targets,"vote","vote")+'<button class="target skip" onclick="sendMafiaAction(\'vote\',\'skip\')">'+t("skip")+'</button>'}else{detail=t("youEliminated")}}
 else if(stage==="voteResult"){title=t("voteResult");if(s.voteOutcome?.eliminatedName){text="⚖️";detail=esc(s.voteOutcome.eliminatedName)+t("voteOut")}else if(s.voteOutcome?.timedOut){text="⌛";detail=t("timeout")}else{text="🤝";detail=t("noVoteOut")}}
 else if(stage==="finished"){title=s.winner==="mafia"?t("mafiaWins"):t("townWins");text="🏆";detail=t("roles");area=(s.players||[]).map(p=>{const r=s.revealedRoles?.[p.id]||"citizen",m=roleMeta(r);return '<div class="role-reveal-row"><span class="mini">'+m.icon+'</span><div><strong>'+esc(p.name)+'</strong><div class="muted">'+t(m.name)+'</div></div></div>'}).join("")}
 else if(stage==="ended"){title=t("end");text="🏁";detail=t("end")}
 $("stageTitle").textContent=title;
 $("stageText").textContent=text;
 $("stageDetail").textContent=detail;
 $("actionArea").innerHTML=area;
 updateTimer(s);
}
function updateTimer(s){if(!s)return;if(s.stage==="hide"){$("stageDetail").textContent=t("hide");$("stageText").textContent=fmt((s.stageEndsAt||Date.now())-Date.now())}else if(s.stage==="discussion"){$("stageDetail").textContent=t("timeLeft");$("stageText").textContent=fmt(s.discussionRemainingMs)}}
function fmt(ms){const sec=Math.max(0,Math.ceil((ms||0)/1000));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
async function sendMafiaAction(action,targetId){unlockVoice();const buttons=$("actionArea").querySelectorAll("button");buttons.forEach(b=>b.disabled=true);try{await api("player-action",{roomId,key,playerId,action,...(targetId?{targetId}:{})});lastRenderKey="";await poll()}catch(e){$("playerStatus").textContent=e.message;lastRenderKey="";await poll()}}
function voiceLine(s){
 const ar=lang==="ar",k=s.stage;
 const en={nightIntro:"Everyone, close your eyes.",mafiaOpen:"Mafia, open your eyes and choose someone to kill.",mafiaClose:"Mafia, close your eyes.",doctorOpen:"Doctor, open your eyes and choose someone to save.",doctorClose:"Doctor, close your eyes.",investigatorOpen:"Investigator, open your eyes and choose someone to investigate.",investigatorClose:"Investigator, close your eyes.",nightResult:s.nightOutcome?.eliminatedName?s.nightOutcome.eliminatedName+" has been eliminated.":s.nightOutcome?.saved?"The Doctor saved someone. Nobody was eliminated.":"Nobody was eliminated tonight.",discussion:"Everyone, open your eyes. You have ten minutes to discuss.",voteResult:s.voteOutcome?.eliminatedName?s.voteOutcome.eliminatedName+" has been eliminated by the vote.":"The vote is complete. No one was eliminated."};
 const aa={nightIntro:"الجميع يغمض عينيه.",mafiaOpen:"يا مافيا، افتح عينيك واختر لاعباً لإقصائه.",mafiaClose:"يا مافيا، أغمض عينيك.",doctorOpen:"يا طبيب، افتح عينيك واختر لاعباً لإنقاذه، ويمكنك إنقاذ نفسك.",doctorClose:"يا طبيب، أغمض عينيك.",investigatorOpen:"يا محقق، افتح عينيك واختر لاعباً للتحقيق معه.",investigatorClose:"يا محقق، أغمض عينيك.",nightResult:s.nightOutcome?.eliminatedName?s.nightOutcome.eliminatedName+" تم إقصاؤه.":s.nightOutcome?.saved?"أنقذ الطبيب أحد اللاعبين. لم يتم إقصاء أحد.":"لم يتم إقصاء أي لاعب الليلة.",discussion:"الجميع يفتح عينيه. لديكم عشر دقائق للنقاش.",voteResult:s.voteOutcome?.eliminatedName?s.voteOutcome.eliminatedName+" تم إقصاؤه بالتصويت.":"انتهى التصويت. لم يتم إقصاء أحد."};
 return (ar?aa:en)[k]||"";
}
async function loadNarrationBuffer(url){
 if(!audioContext)throw new Error("Audio is not unlocked yet");
 if(!narrationBufferCache.has(url)){
  const pending=fetch(url,{cache:"force-cache"}).then(async response=>{
   if(!response.ok)throw new Error("Audio file not found: "+url);
   return audioContext.decodeAudioData(await response.arrayBuffer());
  });
  narrationBufferCache.set(url,pending);
  pending.catch(()=>narrationBufferCache.delete(url));
 }
 return narrationBufferCache.get(url);
}
async function playNarrationClip(url,text,voiceLang,epoch){
 try{
  if(!audioContext)throw new Error("Tap Enable sound first");
  if(audioContext.state==="suspended")await audioContext.resume();
  const buffer=await loadNarrationBuffer(url);
  if(epoch!==narrationEpoch)return;
  const source=audioContext.createBufferSource();
  source.buffer=buffer;source.connect(audioContext.destination);activeNarrationSource=source;
  await new Promise(resolve=>{
   source.onended=()=>{if(activeNarrationSource===source)activeNarrationSource=null;resolve()};
   source.start(0);
  });
 }catch(error){
  if(epoch===narrationEpoch){
   $("playerStatus").textContent="Narration audio could not be loaded. Check your connection and refresh.";
   console.error("JALSA Mafia narration error:",error);
  }
 }
}
function resetNarrationForLanguageChange(){
 narrationEpoch++;
 try{if(activeNarrationSource)activeNarrationSource.stop()}catch{}
 activeNarrationSource=null;narrationQueue=Promise.resolve();queuedNarrationKeys.clear();
 try{if(window.speechSynthesis)speechSynthesis.cancel()}catch{}
}
function playStageVoice(s){
 if(!s||!["nightIntro","mafiaOpen","mafiaClose","doctorOpen","doctorClose","investigatorOpen","investigatorClose","nightResult","discussion","voteResult"].includes(s.stage))return;
 const voiceLang=s.language==="ar"?"ar":"en";
 const seq=s.round+":"+s.stageSeq+":"+voiceLang;
 if(queuedNarrationKeys.has(seq))return;
 const text=voiceLine(s);if(!text)return;
 queuedNarrationKeys.add(seq);lastNarrationKey=seq;
 let fileKey=s.stage;
 if(s.stage==="nightResult")fileKey=s.nightOutcome?.eliminatedName?"nightEliminated":s.nightOutcome?.saved?"doctorSaved":"nightNoElimination";
 if(s.stage==="voteResult")fileKey=s.voteOutcome?.eliminatedName?"voteEliminated":"voteNoElimination";
 const url="/audio/mafia/"+voiceLang+"/"+fileKey+".mp3";
 const epoch=narrationEpoch;
 narrationQueue=narrationQueue.then(async()=>{
  if(epoch!==narrationEpoch)return;
  await playNarrationClip(url,text,voiceLang,epoch);
  if(epoch!==narrationEpoch)return;
  await new Promise(resolve=>setTimeout(resolve,5000));
 }).catch(()=>{});
}
function playNarrationEvents(s){
 if(!audioContext||audioContext.state!=="running")return;
 const events=Array.isArray(s.narrationEvents)?[...s.narrationEvents].sort((a,b)=>a.stageSeq-b.stageSeq):[];
 for(const event of events){
  const seq=Number(event.stageSeq||0);
  if(!seq||seq<=lastNarrationSeq)continue;
  lastNarrationSeq=seq;
  try{localStorage.setItem("jalsa_mafia_narration_"+roomId,String(lastNarrationSeq))}catch{}
  playStageVoice(event);
 }
}
async function poll(){if(!playerId)return;try{const d=await api("player-state?roomId="+encodeURIComponent(roomId)+"&key="+encodeURIComponent(key)+"&playerId="+encodeURIComponent(playerId));currentState=d.state;renderState(currentState);playStageVoice(currentState)}catch(e){$("playerStatus").textContent=e.message||t("error")}}
function beginPolling(){if(!pollTimer)pollTimer=setInterval(poll,900);poll()}
document.addEventListener("pointerdown",unlockVoice,{capture:true,passive:true});
document.addEventListener("keydown",unlockVoice,{capture:true});
applyLang();
</script></body></html>
