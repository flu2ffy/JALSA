<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#55151c"><title>JALSA Remote</title>
<style>
:root{color-scheme:light;--wine:#55151c;--red:#a83232;--orange:#ed8245;--cream:#fff3df;--ink:#38231f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#a64b32,transparent 48%),linear-gradient(145deg,#48131a,#7c2028 62%,#a44b32);font-family:Arial,sans-serif;color:var(--ink);padding:18px}
main{max-width:560px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;color:#fff1d9;margin:4px 0 18px}.brand{font:900 24px Georgia,serif;letter-spacing:2px}.lang{border:1px solid #e9c99b;border-radius:20px;background:#fff3df;color:var(--wine);padding:9px 13px;font-weight:800}
.card{background:#fff4e3;border:2px solid #e2b76e;border-radius:24px;padding:22px;box-shadow:0 18px 42px #1d070b66}.status{font-size:13px;color:#6d564a;font-weight:800;margin-bottom:14px}.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.team{background:#fff;border:2px solid #d76a54;border-radius:15px;padding:13px;text-align:center}.team:nth-child(2){border-color:#7892bf}.team strong{display:block;font-size:14px;overflow-wrap:anywhere}.team b{display:block;color:var(--wine);font-size:30px;margin-top:5px}.question{background:#fff;border-radius:16px;padding:17px;margin:15px 0;min-height:90px}.question small{color:#9a5036;font-weight:900}.question p{font:700 20px/1.35 Georgia,serif;margin:9px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{border:0;border-radius:14px;min-height:54px;padding:12px 10px;background:linear-gradient(140deg,#b83b35,#81212a);color:white;font-weight:900;font-size:15px;box-shadow:0 4px 0 #5d1820}.actions button.secondary{background:#e9d8c3;color:var(--wine);box-shadow:0 4px 0 #c7ad8f}.actions button.gold{background:linear-gradient(140deg,#eaa24b,#c66b2e);box-shadow:0 4px 0 #97501b}.actions button:disabled{opacity:.38;box-shadow:none}.wide{grid-column:1/-1}.hint{text-align:center;color:#f9e3ca;font-size:12px;line-height:1.5;margin:15px 8px}.error{color:#9c2727}
</style></head><body><main><header class="top"><div class="brand">JALSA REMOTE</div><button class="lang" id="langBtn">العربية</button></header>
<section class="card"><div class="status" id="status">Connecting to your JALSA game…</div>
<div class="score"><div class="team"><strong id="team0">Team 1</strong><b id="score0">0</b></div><div class="team"><strong id="team1">Team 2</strong><b id="score1">0</b></div></div>
<div class="question"><small id="questionLabel">CURRENT QUESTION</small><p id="question">Waiting for the game to start…</p><p id="answer" hidden></p></div>
<div class="actions">
<button id="previous" class="secondary">← Previous</button><button id="next">Next question →</button>
<button id="reveal" class="gold wide">Reveal answer</button>
<button id="award0">Team 1 gets points</button><button id="award1">Team 2 gets points</button>
<button id="pass" class="secondary wide">No points · Pass turn</button>
<button id="pause" class="secondary wide">Pause game</button>
</div></section><p class="hint" id="hint">This phone controls this JALSA game only. Keep this page open while playing.</p></main>
<script>
const params=new URLSearchParams(location.hash.slice(1));const roomId=params.get("room"),key=params.get("key");let isAr=/^ar/i.test(navigator.language),lastState=null,sendBusy=false;
const $=id=>document.getElementById(id);
const words={en:{connecting:"Connecting to your JALSA game…",connected:"Connected · Host phone controller",ended:"This remote session has ended.",lost:"Connection lost. Reconnecting…",waiting:"Waiting for the host to start a question…",question:"CURRENT QUESTION",answer:"ANSWER",reveal:"Reveal answer",hide:"Answer revealed",next:"Next question →",previous:"← Previous",pass:"No points · Pass turn",pause:"Pause game",resume:"Resume game",hint:"This phone controls this JALSA game only. Keep this page open while playing.",team:"Team",points:"points",award:"gets points",paused:"GAME PAUSED",board:"Choose a question on the TV or tap Next question here."},ar:{connecting:"جارٍ الاتصال بلعبة جلسة…",connected:"متصل · هاتف المضيف",ended:"انتهت جلسة التحكم عن بُعد.",lost:"انقطع الاتصال. جارٍ إعادة المحاولة…",waiting:"بانتظار المضيف لبدء السؤال…",question:"السؤال الحالي",answer:"الإجابة",reveal:"إظهار الإجابة",hide:"تم إظهار الإجابة",next:"السؤال التالي ←",previous:"→ السابق",pass:"بدون نقاط · تخطي الدور",pause:"إيقاف مؤقت",resume:"استئناف اللعبة",hint:"يتحكم هذا الهاتف بلعبة جلسة الحالية فقط. اترك الصفحة مفتوحة أثناء اللعب.",team:"الفريق",points:"نقطة",award:"يحصل على النقاط",paused:"اللعبة متوقفة مؤقتاً",board:"اختر سؤالاً من شاشة التلفاز أو اضغط السؤال التالي هنا."}};
function t(k){return words[isAr?"ar":"en"][k]||words.en[k]||k}
function lang(){document.documentElement.lang=isAr?"ar":"en";document.documentElement.dir=isAr?"rtl":"ltr";$("langBtn").textContent=isAr?"English":"العربية";$("questionLabel").textContent=t("question");$("reveal").textContent=t("reveal");$("next").textContent=t("next");$("previous").textContent=t("previous");$("pass").textContent=t("pass");$("pause").textContent=lastState?.paused?t("resume"):t("pause");$("hint").textContent=t("hint")}
$("langBtn").onclick=()=>{isAr=!isAr;lang();render(lastState)};
async function request(path,body){const r=await fetch("/api/remote/"+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Connection failed.");return d}
async function send(action){if(sendBusy)return;sendBusy=true;try{await request("command",{roomId,key,action});if(action==="reveal"&&lastState){lastState.revealed=true;render(lastState)}}catch(e){$("status").textContent=e.message;$("status").classList.add("error")}finally{sendBusy=false}}
function render(s){if(!s)return;lastState=s;$("team0").textContent=s.teamNames?.[0]||"Team 1";$("team1").textContent=s.teamNames?.[1]||"Team 2";$("score0").textContent=s.scores?.[0]??0;$("score1").textContent=s.scores?.[1]??0;$("question").textContent=s.question||(s.screen==="board"?t("board"):t("waiting"));$("answer").hidden=!s.revealed;$("answer").textContent=s.revealed?"✓ "+(s.answer||""):"";$("status").textContent=s.paused?t("paused"):t("connected");$("pause").textContent=s.paused?t("resume"):t("pause");$("award0").textContent=(s.teamNames?.[0]||"Team 1")+" "+t("award");$("award1").textContent=(s.teamNames?.[1]||"Team 2")+" "+t("award");const inQuestion=s.screen==="question";["reveal","award0","award1","pass","previous"].forEach(id=>$(id).disabled=!inQuestion);$("reveal").disabled=!inQuestion||s.revealed;$("next").disabled=!!s.paused;lang()}
async function poll(){if(!roomId||!key){$("status").textContent="Invalid QR link. Scan the code on the JALSA game screen.";$("status").classList.add("error");return}try{const d=await request("state",{roomId,key});if(d.ended){$("status").textContent=t("ended");clearInterval(timer);document.querySelectorAll("button").forEach(b=>b.disabled=true);return}render(d.state)}catch(e){$("status").textContent=e.message;$("status").classList.add("error")}}
$("previous").onclick=()=>send("previous");$("next").onclick=()=>send("next");$("reveal").onclick=()=>send("reveal");$("award0").onclick=()=>send("award0");$("award1").onclick=()=>send("award1");$("pass").onclick=()=>send("pass");$("pause").onclick=()=>send("pause");
lang();poll();const timer=setInterval(poll,1000);
</script></body></html>
