<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#55151c"><title>JALSA Remote</title>
<style>
:root{color-scheme:light;--wine:#55151c;--red:#a83232;--orange:#ed8245;--cream:#fff3df;--ink:#38231f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#a64b32,transparent 48%),linear-gradient(145deg,#48131a,#7c2028 62%,#a44b32);font-family:Arial,sans-serif;color:var(--ink);padding:18px}
main{max-width:560px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;color:#fff1d9;margin:4px 0 18px}.brand{font:900 24px Georgia,serif;letter-spacing:2px}.lang{border:1px solid #e9c99b;border-radius:20px;background:#fff3df;color:var(--wine);padding:9px 13px;font-weight:800}
.card{background:#fff4e3;border:2px solid #e2b76e;border-radius:24px;padding:22px;box-shadow:0 18px 42px #1d070b66}.status{font-size:13px;color:#6d564a;font-weight:800;margin-bottom:14px}.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.team{background:#fff;border:2px solid #d76a54;border-radius:15px;padding:13px;text-align:center}.team:nth-child(2){border-color:#7892bf}.team strong{display:block;font-size:14px;overflow-wrap:anywhere}.team b{display:block;color:var(--wine);font-size:30px;margin-top:5px}.answer-panel{background:#fff;border-radius:16px;padding:17px;margin:15px 0;min-height:74px}.answer-panel small{color:#9a5036;font-weight:900}.answer-panel p{font:700 19px/1.35 Georgia,serif;margin:9px 0 0}.control-title{font-size:12px;font-weight:900;color:#765c4e;margin:15px 0 8px;text-align:center}.remote-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:0 auto 14px}.remote-pad button{height:58px;border:0;border-radius:15px;background:linear-gradient(145deg,#b83b35,#81212a);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 #5d1820;touch-action:manipulation}.remote-pad button:active,.actions button:active{transform:translateY(2px);box-shadow:0 1px 0 #5d1820}.remote-pad .empty{visibility:hidden}.remote-pad .ok{background:linear-gradient(145deg,#eaa24b,#c66b2e);font-size:15px}.remote-pad .back{background:#e9d8c3;color:var(--wine);box-shadow:0 4px 0 #c7ad8f;font-size:13px}.power-status{font-size:13px;text-align:center;color:#765c4e;margin:7px 0 10px;font-weight:800}.power-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.power-actions button{border:1px solid #e3ba8f;border-radius:13px;background:#fff;color:var(--wine);padding:12px 5px;min-height:68px;font-size:13px;font-weight:900;box-shadow:0 3px 0 #e6c49f}.power-actions button span{display:block;font-size:22px;margin-bottom:4px}.power-actions button:disabled{opacity:.35;box-shadow:none}.trackpad{height:190px;border:2px solid #d8b98f;border-radius:18px;background:radial-gradient(circle at center,#fff 0,#f2e3d0 100%);position:relative;overflow:hidden;touch-action:none;user-select:none}.trackpad:before,.trackpad:after{content:"";position:absolute;background:#dfc8a9;opacity:.7}.trackpad:before{height:1px;left:12%;right:12%;top:50%}.trackpad:after{width:1px;top:12%;bottom:12%;left:50%}.trackdot{position:absolute;width:24px;height:24px;border-radius:50%;background:#8a2630;border:3px solid #fff;box-shadow:0 2px 8px #35101766;transform:translate(-50%,-50%);left:50%;top:50%;pointer-events:none}.track-help{font-size:11px;text-align:center;color:#856b5a;margin:7px 0 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{border:0;border-radius:14px;min-height:54px;padding:12px 10px;background:linear-gradient(140deg,#b83b35,#81212a);color:white;font-weight:900;font-size:15px;box-shadow:0 4px 0 #5d1820}.actions button.secondary{background:#e9d8c3;color:var(--wine);box-shadow:0 4px 0 #c7ad8f}.actions button.gold{background:linear-gradient(140deg,#eaa24b,#c66b2e);box-shadow:0 4px 0 #97501b}.actions button:disabled{opacity:.38;box-shadow:none}.wide{grid-column:1/-1}.hint{text-align:center;color:#f9e3ca;font-size:12px;line-height:1.5;margin:15px 8px}.error{color:#9c2727}
</style></head><body><main><header class="top"><div class="brand">JALSA REMOTE</div><button class="lang" id="langBtn">العربية</button></header>
<section class="card"><div class="status" id="status">Connecting to your JALSA game…</div>
<div class="score"><div class="team"><strong id="team0">Team 1</strong><b id="score0">0</b></div><div class="team"><strong id="team1">Team 2</strong><b id="score1">0</b></div></div>
<div class="answer-panel"><small id="answerLabel">ANSWER</small><p id="answerWaiting">The question stays on the main screen. Reveal the answer when ready.</p><p id="answer" hidden></p></div>
 <div class="control-title" id="remotePadLabel">TV REMOTE</div><div class="remote-pad" id="remotePad"><span class="empty"></span><button data-nav="up" aria-label="Up">▲</button><span class="empty"></span><button data-nav="left" aria-label="Left">◀</button><button class="ok" data-nav="select">OK</button><button data-nav="right" aria-label="Right">▶</button><span class="empty"></span><button data-nav="down" aria-label="Down">▼</button><button class="back" data-nav="back">BACK</button></div><div class="control-title" id="powerTitle">TEAM POWER</div><div class="power-status" id="powerStatus">Waiting for the active team…</div><div class="power-actions" id="powerActions"></div>
<div class="actions">

<button id="reveal" class="gold wide">Reveal answer</button>
<button id="award0">Team 1 gets points</button><button id="award1">Team 2 gets points</button>
<button id="pass" class="secondary wide">No points · Pass turn</button>
<button id="pause" class="secondary wide">Pause game</button>
</div></section><p class="hint" id="hint">This phone controls this JALSA game only. Keep this page open while playing.</p></main>
<script>
const params=new URLSearchParams(location.hash.slice(1));const roomId=params.get("room"),key=params.get("key");let controllerId=sessionStorage.getItem("jalsa_remote_controller");if(!controllerId){controllerId=crypto.randomUUID().replace(/-/g,"");sessionStorage.setItem("jalsa_remote_controller",controllerId)}let isAr=/^ar/i.test(navigator.language),lastState=null,sendBusy=false;
const $=id=>document.getElementById(id);
const words={en:{connecting:"Connecting to your JALSA game…",connected:"Connected · Host phone controller",ended:"This remote session has ended.",lost:"Connection lost. Reconnecting…",waiting:"Waiting for the host to start a question…",question:"CURRENT QUESTION",answer:"ANSWER",remotePadLabel:"TV REMOTE",powerTitle:"TEAM POWER",powerWaiting:"Waiting for the active team…",powerAvailable:"Power-ups for",call:"Call a friend",double:"Double points",steal:"Steal a question",answerWaiting:"The question stays on the main screen. Reveal the answer when ready.",reveal:"Reveal answer",hide:"Answer revealed",next:"Next question →",previous:"← Previous",pass:"No points · Pass turn",pause:"Pause game",resume:"Resume game",hint:"This phone controls this JALSA game only. Keep this page open while playing.",team:"Team",points:"points",award:"gets points",paused:"GAME PAUSED",board:"Choose a question on the TV or tap Next question here."},ar:{connecting:"جارٍ الاتصال بلعبة جلسة…",connected:"متصل · هاتف المضيف",ended:"انتهت جلسة التحكم عن بُعد.",lost:"انقطع الاتصال. جارٍ إعادة المحاولة…",waiting:"بانتظار المضيف لبدء السؤال…",question:"السؤال الحالي",answer:"الإجابة",remotePadLabel:"جهاز تحكم التلفاز",powerTitle:"قوى الفريق",powerWaiting:"بانتظار الفريق صاحب الدور…",powerAvailable:"قوى الفريق",call:"اتصل بصديق",double:"مضاعفة النقاط",steal:"سرقة سؤال",answerWaiting:"السؤال يظهر على الشاشة الرئيسية. أظهر الإجابة عند الحاجة.",reveal:"إظهار الإجابة",hide:"تم إظهار الإجابة",next:"السؤال التالي ←",previous:"→ السابق",pass:"بدون نقاط · تخطي الدور",pause:"إيقاف مؤقت",resume:"استئناف اللعبة",hint:"يتحكم هذا الهاتف بلعبة جلسة الحالية فقط. اترك الصفحة مفتوحة أثناء اللعب.",team:"الفريق",points:"نقطة",award:"يحصل على النقاط",paused:"اللعبة متوقفة مؤقتاً",board:"اختر سؤالاً من شاشة التلفاز أو اضغط السؤال التالي هنا."}};
function t(k){return words[isAr?"ar":"en"][k]||words.en[k]||k}
function lang(){document.documentElement.lang=isAr?"ar":"en";document.documentElement.dir=isAr?"rtl":"ltr";$("langBtn").textContent=isAr?"English":"العربية";$("answerLabel").textContent=t("answer");$("remotePadLabel").textContent=t("remotePadLabel");$("powerTitle").textContent=t("powerTitle");$("answerWaiting").textContent=t("answerWaiting");$("reveal").textContent=t("reveal");$("pass").textContent=t("pass");$("pause").textContent=lastState?.paused?t("resume"):t("pause");$("hint").textContent=t("hint")}
$("langBtn").onclick=()=>{isAr=!isAr;lang();render(lastState)};
async function request(path,body){const r=await fetch("/api/remote/"+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({...body,controllerId})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Connection failed.");return d}
async function send(action){if(sendBusy)return;sendBusy=true;try{await request("command",{roomId,key,action});if(action==="reveal"&&lastState){lastState.revealed=true;render(lastState)}}catch(e){$("status").textContent=e.message;$("status").classList.add("error")}finally{sendBusy=false}}
function render(s){if(!s)return;lastState=s;$("team0").textContent=s.teamNames?.[0]||"Team 1";$("team1").textContent=s.teamNames?.[1]||"Team 2";$("score0").textContent=s.scores?.[0]??0;$("score1").textContent=s.scores?.[1]??0;$("answer").hidden=!s.revealed;$("answerWaiting").hidden=!!s.revealed;$("answer").textContent=s.revealed?"✓ "+(s.answer||""):"";$("status").textContent=s.paused?t("paused"):t("connected");$("pause").textContent=s.paused?t("resume"):t("pause");$("award0").textContent=(s.teamNames?.[0]||"Team 1")+" "+t("award");$("award1").textContent=(s.teamNames?.[1]||"Team 2")+" "+t("award");const inQuestion=s.screen==="question";["reveal","award0","award1","pass"].forEach(id=>$(id).disabled=!inQuestion);$("reveal").disabled=!inQuestion||s.revealed;$("award0").disabled=!inQuestion||!s.revealed;$("award1").disabled=!inQuestion||!s.revealed;$("pass").disabled=!inQuestion||!s.revealed;renderPowers(s);lang()}
function renderPowers(s){const host=$("powerActions"),active=Number(s.turn)===1?1:0,p=(s.power&&s.power[active])||{call:false,double:false,steal:false},available=s.screen==="board"&&!s.paused;const labels=[["call","📞"],["double","2×"],["steal","⇄"]];$("powerStatus").textContent=(s.teamNames?.[active]||("Team "+(active+1)))+" · "+t("powerAvailable");host.innerHTML=labels.filter(([key])=>!p[key]).map(([key,icon])=>'<button data-power="'+key+'" '+(available?"":"disabled")+'><span>'+icon+'</span>'+t(key)+'</button>').join("");host.querySelectorAll("[data-power]").forEach(b=>b.addEventListener("click",()=>send("power"+b.dataset.power[0].toUpperCase()+b.dataset.power.slice(1))))}
async function poll(){if(!roomId||!key){$("status").textContent="Invalid QR link. Scan the code on the JALSA game screen.";$("status").classList.add("error");return}try{const d=await request("read",{roomId,key});if(d.ended){$("status").textContent=t("ended");clearInterval(timer);document.querySelectorAll("button").forEach(b=>b.disabled=true);return}render(d.state)}catch(e){$("status").textContent=e.message;$("status").classList.add("error")}}
$("reveal").onclick=()=>send("reveal");$("award0").onclick=()=>send("award0");$("award1").onclick=()=>send("award1");$("pass").onclick=()=>send("pass");$("pause").onclick=()=>send("pause");
document.querySelectorAll("[data-nav]").forEach(button=>{const action=button.dataset.nav;button.addEventListener("pointerdown",e=>{e.preventDefault();sendNav(action)})});
async function sendNav(action){try{await request("command",{roomId,key,action:"nav"+action[0].toUpperCase()+action.slice(1)})}catch(e){$("status").textContent=e.message;$("status").classList.add("error")}}
lang();let timer=null,pollBusy=false;async function poll(){if(pollBusy)return;pollBusy=true;try{if(!roomId||!key)throw new Error("Invalid QR link. Scan the code on the JALSA game screen.");const d=await request("read",{roomId,key});if(d.ended){$("status").textContent=t("ended");clearTimeout(timer);return}render(d.state)}catch(e){$("status").textContent=e.message;$("status").classList.add("error")}finally{pollBusy=false;timer=setTimeout(poll,650)}}async function connect(){try{await request("claim",{roomId,key});poll()}catch(e){$("status").textContent=e.message;$("status").classList.add("error");document.querySelectorAll("button").forEach(b=>b.disabled=true)}}connect();
</script></body></html>
