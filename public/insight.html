<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSIGHT · JALSA</title>
<style>
:root{color-scheme:dark;--wine:#50131b;--red:#a92732;--orange:#ef8b42;--cream:#fff0d8;--ink:#301b1d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 80% 10%,#8d382d,#421018 65%);color:var(--cream);min-height:100vh}
header{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;background:#fff0d8;color:var(--wine)}header a{color:inherit;text-decoration:none;font-weight:900}.brand{font: bold 26px Georgia,serif}
main{width:min(760px,100%);margin:0 auto;padding:28px 18px 60px}.panel{background:var(--cream);color:var(--ink);border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 60px #16050966;margin:18px 0}
h1{font: bold clamp(36px,8vw,58px) Georgia,serif;text-align:center;color:#fff0d8;margin:16px 0 8px}.sub{text-align:center;color:#f3d8bd}.panel h2{margin:0 0 14px;color:var(--wine);font: bold 27px Georgia,serif}
input,textarea,select{width:100%;padding:15px;border:1px solid #d7b98f;border-radius:12px;font:inherit;background:white;color:#2e2020;margin:8px 0 14px}
button{border:0;border-radius:28px;padding:14px 22px;font-weight:900;background:linear-gradient(135deg,#b72e38,#7e1b27);color:white;cursor:pointer;box-shadow:0 5px 0 #59141e}button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#765f57}.center{text-align:center}.hidden{display:none!important}
#qr{background:white;border-radius:18px;padding:12px;width:220px;height:220px;margin:18px auto;display:grid;place-items:center}#qr img{max-width:100%}
.players{display:flex;flex-wrap:wrap;gap:8px}.player{background:#f6dfc3;border:1px solid #e2c49e;padding:9px 13px;border-radius:20px;font-weight:800}
.danger{background:linear-gradient(145deg,#4a050d,#b20e22);color:#fff;border:3px solid #ff4a52;box-shadow:0 0 34px #e3133155}.danger h2{color:#fff}.danger p{color:#ffe2e2}
#coin{width:150px;height:150px;border-radius:50%;margin:18px auto;background:radial-gradient(circle at 35% 28%,#ffd98a,#e87828 70%,#a94718);border:8px double #ffe5a8;display:grid;place-items:center;color:#57200e;font:bold 24px Georgia,serif;box-shadow:0 12px 30px #5d1d12aa}
#coin.flip{animation:flip .9s ease-in-out}@keyframes flip{0%{transform:rotateY(0) rotateZ(0)}50%{transform:rotateY(900deg) rotateZ(12deg)}100%{transform:rotateY(1800deg) rotateZ(0)}}
.status{font-weight:800;text-align:center;margin:14px 0;color:#8c2830}.notice{background:#f8dfc4;padding:14px;border-radius:14px;margin:12px 0}.name-choice{display:block;width:100%;margin:8px 0;background:#fff;border:2px solid #dfc19b;color:#4b1b21;box-shadow:none;text-align:left}.name-choice.selected{background:#f5b16e;border-color:#9b3a25}
@media(max-width:520px){main{padding:18px 12px 40px}.panel{border-radius:19px}.row{display:grid}}
</style></head><body>
<header><a class="brand" href="/">JALSA</a><a href="/">Home</a></header>
<main><h1>INSIGHT</h1><p class="sub">Secrets. Suspense. One flip can reveal everything.</p>
<section id="hostLobby" class="panel hidden"><h2>INSIGHT · Host room</h2><p class="muted">Let everyone scan this QR code and enter their name.</p><div id="qr"><span>Preparing QR…</span></div><p id="joinUrl" class="center muted"></p><div class="players" id="hostPlayers"></div><p id="hostCount" class="center muted">0 players</p><button id="startBtn" disabled onclick="hostAction('start')">Start game</button><p id="hostMessage" class="status"></p></section>
<section id="joinPanel" class="panel hidden"><h2>Join INSIGHT</h2><label>Your name</label><input id="playerName" maxlength="32" placeholder="Enter your name"><button onclick="joinGame()">Next</button><p id="joinError" class="status"></p></section>
<section id="phonePanel" class="panel hidden"><div class="center"><strong id="phoneRound">ROUND 1</strong></div><div id="phoneContent" class="center"><h2>Focus on the screen</h2><p>Wait for the game to begin.</p></div></section>
<section id="resultPanel" class="panel hidden"><h2 class="center">Round complete</h2><div id="resultContent"></div><div class="center"><button id="nextBtn" class="hidden" onclick="hostAction('next')">Next round</button></div></section>
</main>
<script src="/qrcode.min.js"></script><script>
const qs=new URLSearchParams(location.search);let roomId=qs.get("roomId"),key=qs.get("key"),playerId=localStorage.getItem("insight:"+roomId),isHost=false,lastStage="",chosenAnswer="",chosenSide="";
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch("/api/insight/"+path,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Something went wrong.");return d}
function show(id){["hostLobby","joinPanel","phonePanel","resultPanel"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function roomBody(extra={}){return {roomId,key,...extra}}
async function init(){
 if(roomId&&key){show(playerId?"phonePanel":"joinPanel");if(playerId)poll();return}
 try{const d=await api("create",{});roomId=d.roomId;key=d.key;isHost=true;history.replaceState(null,"","/insight.html?roomId="+encodeURIComponent(roomId)+"&key="+encodeURIComponent(key));show("hostLobby");const link=location.origin+"/insight.html?roomId="+encodeURIComponent(roomId)+"&key="+encodeURIComponent(key);$("joinUrl").textContent=link;if(window.QRCode){$("qr").innerHTML="";try{new QRCode($("qr"),{text:link,width:196,height:196,colorDark:"#16090d",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){$("qr").textContent=link}}else{$("qr").textContent=link}poll()}catch(e){show("hostLobby");$("hostMessage").textContent=e.message}
}
async function joinGame(){const name=$("playerName").value.trim();try{const d=await api("join",roomBody({name}));playerId=d.playerId;localStorage.setItem("insight:"+roomId,playerId);show("phonePanel");poll()}catch(e){$("joinError").textContent=e.message}}
async function hostAction(action,extra={}){try{await api("action",roomBody({action,...extra}));await poll()}catch(e){$("hostMessage").textContent=e.message}}
async function playerAction(action,extra={}){try{await api("action",roomBody({action,playerId,...extra}));await poll()}catch(e){$("phoneContent").innerHTML="<p class='status'>"+esc(e.message)+"</p>"}}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function poll(){try{const q=new URLSearchParams({roomId,key});if(playerId)q.set("playerId",playerId);const d=await api("state?"+q.toString());render(d.state)}catch(e){if(isHost)$("hostMessage").textContent=e.message;else $("phoneContent").textContent=e.message}setTimeout(poll,1100)}
let lastRenderKey="";
function render(s){
 const renderKey=JSON.stringify({host:s.isHost,stage:s.stage,round:s.round,players:s.players.map(p=>[p.id,p.name]),role:s.role,question:s.questionForTarget,waiting:s.waitingForDelivery,answered:s.answered,revealed:s.revealed,reveal:s.reveal,canChoose:s.canChoose});
 if(renderKey===lastRenderKey)return;
 lastRenderKey=renderKey;
 if(s.isHost){show("hostLobby");$("hostPlayers").innerHTML=s.players.map(p=>"<span class='player'>"+esc(p.name)+"</span>").join("");$("hostCount").textContent=s.players.length+" players · "+(s.stage==="lobby"?"Waiting to start":"Round "+s.round);$("startBtn").disabled=s.players.length<3||s.stage!=="lobby";if(s.stage==="round-result"){show("resultPanel");$("nextBtn").classList.remove("hidden");$("resultContent").innerHTML=s.revealed?revealMarkup(s.reveal):"<p class='center'>The answer stays secret. The coin landed on the chosen side.</p>"}else if(s.stage==="ended")$("hostMessage").textContent="Game ended.";else if(s.stage==="active")$("hostMessage").textContent="Round "+s.round+" is in progress.";return}
 show(s.stage==="round-result"?"resultPanel":"phonePanel");$("phoneRound").textContent="ROUND "+s.round;
 if(s.stage==="round-result"){$("resultContent").innerHTML=s.revealed?revealMarkup(s.reveal):"<p class='center'>The answer stays secret. The coin landed on the chosen side.</p>";return}
 if(s.stage==="ended"){$("phoneContent").innerHTML="<h2>Game ended</h2>";return}
 if(s.role==="heartbreaker"&&!s.answered){$("phoneContent").innerHTML="<h2>💔 You're the Heartbreaker</h2><p>Ask anyone a nasty question.</p><label>Choose a player</label><select id='targetSelect'>"+s.players.filter(p=>p.id!==playerId).map(p=>"<option value='"+p.id+"'>"+esc(p.name)+"</option>").join("")+"</select><textarea id='questionInput' maxlength='240' placeholder='Write your question…'></textarea><button onclick='sendQuestion()'>Done</button>";return}
 if(s.role==="target"&&s.questionForTarget){$("phoneContent").innerHTML="<div class='danger' style='padding:24px;border-radius:18px'><h2>⚠ A question for you</h2><p style='font-size:22px'>"+esc(s.questionForTarget)+"</p></div><p>Choose a player as your answer. You cannot choose yourself.</p><div id='answerChoices'>"+s.players.filter(p=>p.id!==playerId).map(p=>"<button class='name-choice "+(chosenAnswer===p.id?"selected":"")+"' onclick='chooseAnswer("+JSON.stringify(p.id)+")'>"+esc(p.name)+"</button>").join("")+"</div><p>Choose your coin side</p><div class='row'><button class='name-choice' onclick=\"chooseSide('heads')\">Heads</button><button class='name-choice' onclick=\"chooseSide('tails')\">Tails</button></div><div id='coin'>JALSA</div><button onclick='flipCoin()' "+(!chosenAnswer||!chosenSide?"disabled":"")+">Flip coin</button>";return}
 if(s.waitingForDelivery){$("phoneContent").innerHTML="<h2>Focus on the screen</h2><p>Your question is on its way…</p>";return}
 $("phoneContent").innerHTML="<h2>"+(s.role==="heartbreaker"?"Your question was sent.":"Focus on the screen")+"</h2><p>Wait for the next moment.</p>";
}
function sendQuestion(){const targetId=$("targetSelect").value,question=$("questionInput").value.trim();playerAction("ask",{targetId,question})}
function chooseAnswer(id){chosenAnswer=id;poll()}
function chooseSide(side){chosenSide=side;poll()}
async function flipCoin(){const coin=$("coin");coin.classList.add("flip");coin.textContent="";setTimeout(()=>playerAction("flip",{answerId:chosenAnswer,coinChoice:chosenSide}),900)}
function revealMarkup(r){return "<div class='danger' style='padding:22px;border-radius:18px'><p>💔 HEARTBREAKER: "+esc(r.heartbreakerName)+"</p><h2>“"+esc(r.question)+"”</h2><p>"+esc(r.targetName)+" answered: <strong>"+esc(r.answerName)+"</strong></p><p>Chosen side: "+esc(r.coinChoice)+" · Coin: "+esc(r.coinResult)+"</p></div>"}
init();
</script></body></html>
